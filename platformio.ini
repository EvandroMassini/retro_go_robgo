; Emulador MSX2 (fMSX) para ESP32-WROVER + VGA32 (RobGo-RG / TTGO VGA32 v1.4)
; Compile e envie pelos botões do VS Code (Build e Upload).

[platformio]
default_envs = msx2

[env:msx2]
; A FabGL não funciona com o pacote esp32 3.x: a série 6.x da plataforma usa Arduino core 2.0.x.
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

; Flash QIO + PSRAM QSPI (WROVER).
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
; 3 MB para o app, sem OTA.
board_build.partitions = huge_app.csv

monitor_speed = 115200


lib_deps =
    fdivitto/FabGL@^1.0.9

build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DMSX_ESP32
    -DMSX_Z80_IN_IRAM=1
    -Isrc/fmsx
    -Isrc/fmsx/EMULib
    -Isrc/fmsx/fMSX
    -Isrc/fmsx/Z80
    -Wno-error=stringop-truncation
    -Wno-error=format-overflow
    -Wno-implicit-fallthrough
    -Wno-format-overflow
    -Wno-stringop-truncation
    -Wno-unused-but-set-variable
    -Wno-unused-variable

; Fora do build: rede, toque, IPS e depuração do EMULib (não usados).
build_src_filter =
    +<*>
    -<fmsx/EMULib/NetPlay.c>
    -<fmsx/EMULib/Touch.c>
    -<fmsx/EMULib/IPS.c>
    -<fmsx/Z80/Debug.c>
    -<fmsx/Z80/ConDebug.c>
